<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Som 3D Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0e14; color: #fff; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 50vh; }
        #controls { height: 50vh; overflow-y: auto; padding: 15px; box-sizing: border-box; background: #121824; }
        .control-group { margin-bottom: 15px; background: #1a2332; padding: 10px; border-radius: 8px; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #00d2ff; }
        select, input { width: 100%; padding: 8px; background: #0b0e14; color: #fff; border: 1px solid #2a3b55; border-radius: 4px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="controls">
        <div class="control-group">
            <label>MODELO DO PROJETO</label>
            <select id="modeloProjeto">
                <option value="trio">Caixa Trio Completa</option>
                <option value="woofers3">Caixa 3 Woofers Invertidos</option>
                <option value="torre">Torre Dupla (4 Graves + Trio)</option>
            </select>
        </div>
        <div class="control-group">
            <label>MARCA WOOFER (LOGOTIPO)</label>
            <select id="marcaWoofer">
                <option value="snake">Snake Cobra</option>
                <option value="eros">Eros Target / Ultravox</option>
                <option value="jbl">JBL Tornado 15"</option>
            </select>
        </div>
        <div class="control-group">
            <label>COR / ESTAMPA DA CAIXA</label>
            <select id="estampaCaixa">
                <option value="preto">Preto MDF / Piano</option>
                <option value="mdf">Madeira MDF Crua</option>
            </select>
        </div>
    </div>

    <script>
        // 1. SETUP DE CÂMERA E CENA
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0e14);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Resetar foco centralizado da câmera
        function resetCamera() {
            controls.target.set(0, 1, 0);
            camera.position.set(0, 3, 14);
            controls.update();
        }
        resetCamera();

        // 2. ILUMINAÇÃO SUAVE E CORRIGIDA (SEM ESTOURAR PLÁSTICO/NEON)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 3. GERADOR DE TEXTURAS COM TEXTO (INVERTIDO EM X PARA CORRIGIR ESPELHAMENTO)
        function criarTexturaLogo(texto, corFundo = '#000000', corTexto = '#ff0000') {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = corFundo;
            ctx.fillRect(0, 0, 512, 512);
            
            ctx.fillStyle = corTexto;
            ctx.font = 'Bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(texto, 256, 256);

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.repeat.x = -1; // <--- INVERTE TEXTURA HORIZONTALMENTE
            return texture;
        }

        // MATERIAIS
        const matCaixa = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
        let matDustCap = new THREE.MeshStandardMaterial({ map: criarTexturaLogo('SNAKE') });
        const matCone = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
        const matModulo = new THREE.MeshStandardMaterial({ map: criarTexturaLogo('TARAMPS', '#111', '#ffffff'), roughness: 0.3 });

        // 4. CONSTRUÇÃO DOS ELEMENTOS 3D
        const grupoSom = new THREE.Group();
        scene.add(grupoSom);

        function criarWoofer(invertido = false) {
            const woofer = new THREE.Group();
            
            // Borda do Alto-Falante
            const carcaçaGeo = new THREE.CylinderGeometry(1.2, 1, 0.4, 32);
            const carcaçaMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.5 });
            const carcaça = new THREE.Mesh(carcaçaGeo, carcaçaMat);
            carcaça.rotation.x = Math.PI / 2;
            woofer.add(carcaça);

            if (!invertido) {
                // Cone Normal
                const coneGeo = new THREE.ConeGeometry(1.1, 0.5, 32, 1, true);
                const cone = new THREE.Mesh(coneGeo, matCone);
                cone.rotation.x = -Math.PI / 2;
                cone.position.z = 0.1;
                woofer.add(cone);

                // Calota / DustCap com Marca
                const capGeo = new THREE.SphereGeometry(0.4, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
                const cap = new THREE.Mesh(capGeo, matDustCap);
                cap.rotation.x = Math.PI / 2;
                cap.position.z = 0.2;
                woofer.add(cap);
            } else {
                // Woofer Invertido (Ímã / Motor para fora)
                const imaGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.6, 32);
                const imaMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 });
                const ima = new THREE.Mesh(imaGeo, imaMat);
                ima.rotation.x = Math.PI / 2;
                ima.position.z = 0.5;
                woofer.add(ima);

                const adesivoImaGeo = new THREE.CircleGeometry(0.5, 32);
                const adesivoIma = new THREE.Mesh(adesivoImaGeo, matDustCap);
                adesivoIma.position.z = 0.81;
                woofer.add(adesivoIma);
            }

            return woofer;
        }

        function construirCena() {
            // Limpa elementos anteriores
            while(grupoSom.children.length > 0){ 
                grupoSom.remove(grupoSom.children[0]); 
            }

            const tipoModelo = document.getElementById('modeloProjeto').value;

            // Caixa Principal Corrigida
            const caixaGeo = new THREE.BoxGeometry(7, 3.5, 3);
            const caixa = new THREE.Mesh(caixaGeo, matCaixa);
            caixa.position.set(0, 1.75, 0);
            grupoSom.add(caixa);

            if (tipoModelo === 'trio' || tipoModelo === 'torre') {
                const w1 = criarWoofer(false);
                w1.position.set(-1.8, 1.75, 1.4);
                grupoSom.add(w1);

                const w2 = criarWoofer(false);
                w2.position.set(1.8, 1.75, 1.4);
                grupoSom.add(w2);
            } else if (tipoModelo === 'woofers3') {
                const w1 = criarWoofer(true);
                w1.position.set(-2.2, 1.75, 1.4);
                grupoSom.add(w1);

                const w2 = criarWoofer(true);
                w2.position.set(0, 1.75, 1.4);
                grupoSom.add(w2);

                const w3 = criarWoofer(true);
                w3.position.set(2.2, 1.75, 1.4);
                grupoSom.add(w3);
            }

            // Módulos no Rack Traseiro
            const moduloGeo = new THREE.BoxGeometry(1.5, 2.2, 0.2);
            const modulo = new THREE.Mesh(moduloGeo, matModulo);
            modulo.position.set(0, 1.75, -1.6);
            modulo.rotation.y = Math.PI; // Traseira
            grupoSom.add(modulo);
        }

        // 5. EVENTOS DE INTERAÇÃO DOS MENUS
        document.getElementById('modeloProjeto').addEventListener('change', () => {
            construirCena();
            resetCamera();
        });

        document.getElementById('marcaWoofer').addEventListener('change', (e) => {
            const marca = e.target.value.toUpperCase();
            matDustCap.map = criarTexturaLogo(marca, '#000', '#00d2ff');
            matDustCap.needsUpdate = true;
        });

        document.getElementById('estampaCaixa').addEventListener('change', (e) => {
            if(e.target.value === 'mdf') {
                matCaixa.color.setHex(0xc29b62); // Cor Madeira MDF Crua
                matCaixa.roughness = 0.9;
            } else {
                matCaixa.color.setHex(0x111111); // Preto Piano
                matCaixa.roughness = 0.1;
            }
        });

        // INICIALIZA
        construirCena();

        // LOOP DE RENDERIZAÇÃO
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // REDIMENSIONAMENTO RESPONSIVO
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
